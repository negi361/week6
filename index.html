<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>BMI</title>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen p-4">
    <section class="bg-white w-full max-w-md mx-auto rounded-lg shadow p-8">
        <h1 class="font-bold text-xl mb-2">メスガキBMI診断</h1>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">身長（cm）</label>
            <input id="height" type="number" placeholder="例：160"
            class="w-full border border-gray-300 rounded px-3 py-2">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">体重（kg）</label>
            <input id="weight" type="number" placeholder="例：50"
            class="w-full border border-gray-300 rounded px-3 py-2">
        </div>

        <div>
            <button id="calcBtn" 
            class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">計算する！</button>
        </div>

        <div class="mt-4 text-center text-lg text-gray-800 font-bold">
            <p id="result"></p>
            <p id="result2"></p>
        </div>
    </section>
    
    <script>
        function calcBmi(height, weight) {
            const heightM = height / 100;
            return weight / (heightM * heightM);
        }

        function getJudgment(bmi) {
            if (bmi < 15) {
                return "ちょ、大丈夫？あんまりザコ過ぎると死んじゃうよ(´;ω;｀)";
            } else if (bmi < 18.5) {
                return "うわざっこ笑笑 一番貧弱でいかにも君らしいザコい体笑";
            } else if (bmi < 25) {
                return "普通過ぎてつまんない。もうちょっとザコくなれないわけ？？";
            } else if (bmi < 28) {
                return "うっわ、なんか腹出てて、キモいんですけど～笑笑 運動したら～？？笑";
            } else {
                return "ザコ過ぎて、「とーにょーびょー」ってのになってそう笑 お医者さんに行った方がいいかも笑";
            }
        }

        const button = document.querySelector("#calcBtn");
        const result = document.querySelector("#result");
        const result2 = document.querySelector("#result2")

        button.addEventListener("click", () => {
            const height = Number(document.querySelector("#height").value);
            const weight = Number(document.querySelector("#weight").value);

            if (height <= 0 || weight <= 0){
                result.textContent = "メスガキ：ザコ過ぎて、身長と体重もまともに入力できないわけ？？よっわ笑";
                return;
            }

            const bmi = calcBmi(height, weight);
            const judgment = getJudgment(bmi);

            result.textContent = "BMI: " + bmi.toFixed(1)
            result2.textContent = "メスガキ：" + " " + judgment + " ";
        });
    </script>

</body>
</html>
